{% extends "base.html" %}

{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            {% for category in categories %}
            <h3 class="text-center text-danger mb-3">{{ category.name }}</h3>
            <div class="list-group mb-5 text-center w-50 mx-auto">
                {% for tool in category.tools.all %}
                <a href="{% url 'tools:detail' tool.slug %}"
                    class="list-group-item list-group-item-action text-success">
                    {{ tool.name }}
                </a>
                {% endfor %}
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}

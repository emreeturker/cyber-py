{% extends "base.html" %}

{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="text-center mb-5" style="color: #0d6efd;">{{ tool.name }}</h1>
            <p class="text-center mb-5"
                style="line-height: 1.7; max-width: 650px; margin: 0 auto; color: #ffffff; font-size: 1.15rem; font-weight: 500;">
                {{ tool.description|linebreaksbr }}
            </p>

            <style>
                .category-heading {
                    color: #0d6efd;
                    margin-bottom: 10px;
                }

                .category-table-wrapper {
                    border: 1px solid #444;
                    border-radius: 6px;
                    overflow: hidden;
                    margin-bottom: 24px;
                }

                .category-table-wrapper table {
                    margin-bottom: 0;
                }

                @media (max-width: 767px) {
                    .command-table thead {
                        display: none;
                    }
                    .command-table, .command-table tbody, .command-table tr, .command-table td {
                        display: block;
                        width: 100%;
                    }
                    .command-table tr {
                        margin-bottom: 0;
                        border-bottom: 1px solid #444;
                    }
                    .command-table tr:last-child {
                        border-bottom: none;
                    }
                    .command-table td {
                        padding: 10px 14px;
                        border: none;
                    }
                    .command-table td:first-child {
                        font-weight: bold;
                        background-color: rgba(255,255,255,0.05);
                        word-break: break-word;
                    }
                    .command-table td:before {
                        content: attr(data-label);
                        display: block;
                        font-size: 0.75rem;
                        color: #999;
                        text-transform: uppercase;
                        margin-bottom: 4px;
                        font-weight: normal;
                    }
                }
            </style>

            {% include "partials/content_blocks.html" with blocks=blocks %}
        </div>
    </div>
</div>

{% endblock %}

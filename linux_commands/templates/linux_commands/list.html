{% extends "base.html" %}

{% block content %}

<style>
    .category-table-wrapper table {
        margin-bottom: 0;
    }
</style>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="text-center" style="color: #ffffff;">Linux commands organized by category.</h3>
            <hr style="width: 510px; margin: 8px auto 40px; border-color: #ffffff; opacity: 1;">

            {% for category in categories %}
            <h3 class="text-center mb-3" style="color: #ffc107">
                {{ category.name }}
            </h3>
            <div class="category-table-wrapper"
                style="border: 1px solid #444; border-radius: 6px; overflow: hidden; margin-bottom: 24px;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Command</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for command in category.commands.all %}
                        <tr>
                            <td>{{ command.command }}</td>
                            <td>{{ command.description }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<style>
.category-title {
    color: #ffffff;
    border-bottom: 2px solid #ffffff;
    padding-bottom: 8px;
    display: inline-block;
    font-size: 1.3rem;
    white-space: nowrap;
}
@media (min-width: 768px) {
    .category-title {
        font-size: 1.75rem;
        white-space: normal;
    }
}
.category-heading {
    color: #ffc107;
    margin-bottom: 10px;
}
</style>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="text-center">
                <h3 class="category-title">
                    Linux commands organized by category.
                </h3>
            </div>

            {% for category in categories %}
            <h3 class="text-center mb-3 mt-5" style="color: #ffc107">
                {{ category.name }}
            </h3>
            {% include "partials/content_blocks.html" with elements=category.elements.all %}
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
